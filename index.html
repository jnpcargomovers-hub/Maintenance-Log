<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>JNP Cargo Movers - Maintenance Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input, select, textarea { font-size: 16px !important; }
    .autocomplete-list { max-height: 200px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body { padding-bottom: env(safe-area-inset-bottom, 25px); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-3 sm:p-6" onclick="closeAllDropdowns()">
  <div class="max-w-md mx-auto bg-white shadow-xl rounded-2xl p-4 sm:p-5 border border-slate-200" onclick="event.stopPropagation()">
    
    <!-- Top Bar with Logo & Navigation -->
    <div class="border-b border-slate-200 pb-3 mb-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="flex-shrink-0">
          <img 
            id="brandLogo"
            src="logo.png" 
            alt="JNP Cargo Movers" 
            class="h-11 w-auto object-contain"
            onerror="document.getElementById('brandLogo').classList.add('hidden'); document.getElementById('brandFallback').classList.remove('hidden');"
          />
          <div id="brandFallback" class="hidden h-11 w-14 bg-indigo-950 rounded-xl flex flex-col items-center justify-center text-white shadow-sm">
            <span class="font-black text-sm italic tracking-tighter leading-none">JNP</span>
            <span class="text-[7px] font-bold text-indigo-300 tracking-wider">FLEET</span>
          </div>
        </div>
        <div class="border-l border-slate-200 pl-2.5">
          <h1 class="text-xs sm:text-sm font-extrabold text-indigo-800 tracking-tight leading-tight uppercase">MAINTENANCE LOG</h1>
          <p class="text-[10px] text-slate-500 font-semibold tracking-wider">मेंटेनेंस एवं रिपेयर लॉग</p>
        </div>
      </div>
      <button type="button" onclick="fetchMasters()" class="text-xs text-indigo-700 font-bold hover:underline py-1 px-2.5 rounded-lg bg-indigo-50 border border-indigo-200">↻ Sync</button>
    </div>

    <!-- Active Form -->
    <form id="maintForm" onsubmit="handleFormSubmit(event)" class="space-y-3" autocomplete="off">
      
      <!-- Submitted By -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
          Logged By / दर्जकर्ता *
        </label>
        <select id="staffSelect" onchange="toggleCustomStaff()" required class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium">
          <option value="">Select Staff...</option>
        </select>
        <input type="text" id="staffCustom" placeholder="Enter your name" class="hidden mt-1.5 w-full border border-indigo-400 rounded-xl p-2.5 bg-indigo-50 font-medium" />
      </div>

      <!-- 1. Truck Number -->
      <div class="relative">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
          1. Truck No / गाड़ी नंबर *
        </label>
        <input 
          type="text" 
          id="truckInput" 
          required 
          placeholder="e.g. MH18BZ0271 or 0271" 
          class="w-full border rounded-xl p-2.5 bg-slate-50 font-semibold uppercase tracking-wide focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          oninput="filterOptions('truck', this.value)"
          onfocus="filterOptions('truck', this.value)"
        />
        <div id="truckDropdown" class="autocomplete-list hidden absolute z-30 w-full bg-white border border-slate-300 rounded-xl shadow-2xl mt-1"></div>
      </div>

      <!-- 2. Driver Name -->
      <div class="relative">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
          2. Driver Name / ड्राइवर का नाम *
        </label>
        <input 
          type="text" 
          id="driverInput" 
          required 
          placeholder="Type driver name..." 
          class="w-full border rounded-xl p-2.5 bg-slate-50 font-semibold focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          oninput="filterOptions('driver', this.value)"
          onfocus="filterOptions('driver', this.value)"
        />
        <div id="driverDropdown" class="autocomplete-list hidden absolute z-30 w-full bg-white border border-slate-300 rounded-xl shadow-2xl mt-1"></div>
      </div>

      <!-- 3. Issue / Complaint -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
          3. Issue / Complaint / समस्या या शिकायत *
        </label>
        <textarea id="issueInput" required rows="2" placeholder="e.g. Air leakage near booster, leaf spring broken" class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium"></textarea>
      </div>

      <!-- 4 & 5. AMC Cover & AMC Service -->
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
            4. AMC Cover *
          </label>
          <select id="amcCover" required class="w-full border rounded-xl p-2.5 bg-slate-50 font-semibold text-slate-800">
            <option value="No">No / नहीं</option>
            <option value="Yes">Yes / हाँ</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
            5. AMC Service *
          </label>
          <select id="amcService" onchange="toggleOutsideVendor()" required class="w-full border rounded-xl p-2.5 bg-slate-50 font-semibold text-slate-800">
            <option value="No">No / बाहर सर्विस</option>
            <option value="Yes">Yes / AMC सर्विस</option>
          </select>
        </div>
      </div>

      <!-- 6. Outside Service Provider Name (Conditional) -->
      <div id="vendorBlock" class="relative">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
          6. Outside Vendor / बाहर का गैरेज/दुकान *
        </label>
        <input 
          type="text" 
          id="vendorInput" 
          placeholder="Enter workshop / garage name" 
          class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium focus:bg-white focus:ring-2 focus:ring-indigo-500"
          oninput="filterOptions('vendor', this.value)"
          onfocus="filterOptions('vendor', this.value)"
        />
        <div id="vendorDropdown" class="autocomplete-list hidden absolute z-30 w-full bg-white border border-slate-300 rounded-xl shadow-2xl mt-1"></div>
      </div>

      <!-- 7. Checklist for Service Received -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
          7. Service Checklist / काम की सूची (Select Multiple)
        </label>
        <div id="checklistContainer" class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 max-h-44 overflow-y-auto"></div>
        
        <!-- Add Custom Task -->
        <div class="flex gap-2 mt-2">
          <input type="text" id="customTaskInput" placeholder="Add custom task (e.g. Hub Greasing)" class="flex-1 border rounded-xl p-2 text-xs bg-white" />
          <button type="button" onclick="addCustomTask()" class="px-3 py-2 bg-indigo-100 text-indigo-800 font-bold text-xs rounded-xl hover:bg-indigo-200">+ Add</button>
        </div>
      </div>

      <!-- 8. Open Date & Time Section -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
        <label class="block text-xs font-bold text-indigo-900 uppercase mb-1.5">
          8. Work Opened / काम शुरू विवरण
        </label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <span class="block text-[10px] text-slate-500 font-bold uppercase mb-0.5">Open Date *</span>
            <input type="date" id="openDate" required class="w-full border rounded-xl p-2 bg-white text-xs font-semibold" />
          </div>
          <div>
            <span class="block text-[10px] text-slate-500 font-bold uppercase mb-0.5">Open Time</span>
            <input type="time" id="openTime" class="w-full border rounded-xl p-2 bg-white text-xs font-semibold" />
          </div>
        </div>
      </div>

      <!-- 9. Close Date & Time Section -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
        <label class="block text-xs font-bold text-indigo-900 uppercase mb-1.5">
          9. Work Closed / काम पूरा विवरण
        </label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <span class="block text-[10px] text-slate-500 font-bold uppercase mb-0.5">Close Date</span>
            <input type="date" id="closeDate" class="w-full border rounded-xl p-2 bg-white text-xs font-semibold" />
          </div>
          <div>
            <span class="block text-[10px] text-slate-500 font-bold uppercase mb-0.5">Close Time</span>
            <input type="time" id="closeTime" class="w-full border rounded-xl p-2 bg-white text-xs font-semibold" />
          </div>
        </div>
      </div>

      <!-- 10 & 11. Bill Amount & Approved By -->
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
            10. Bill (₹) / बिल राशि *
          </label>
          <input type="number" step="any" id="billAmount" required placeholder="e.g. 4500" class="w-full border rounded-xl p-2.5 bg-slate-50 font-bold text-slate-900" />
        </div>
        <div class="relative">
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
            11. Approved By / अनुमोदक *
          </label>
          <input 
            type="text" 
            id="approverInput" 
            required 
            placeholder="Approver name" 
            class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium focus:bg-white focus:ring-2 focus:ring-indigo-500"
            oninput="filterOptions('approver', this.value)"
            onfocus="filterOptions('approver', this.value)"
          />
          <div id="approverDropdown" class="autocomplete-list hidden absolute z-30 w-full bg-white border border-slate-300 rounded-xl shadow-2xl mt-1"></div>
        </div>
      </div>

      <!-- Remark -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">
          Remark / टिप्पणी
        </label>
        <input type="text" id="remarkInput" placeholder="Old parts returned, bill attached, etc." class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium" />
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button type="submit" id="saveBtn" class="w-full py-3 bg-indigo-700 active:bg-indigo-900 text-white font-bold text-sm rounded-xl shadow-lg transition">
          Record Maintenance & Send WhatsApp
        </button>
      </div>
    </form>

    <!-- WhatsApp Share Panel -->
    <div id="shareSection" class="hidden mt-4 p-4 border border-emerald-300 bg-emerald-50 rounded-xl space-y-2.5">
      <div class="flex items-center gap-2">
        <span class="text-lg">✅</span>
        <h3 class="text-xs font-bold text-emerald-950 uppercase tracking-wide">Saved to Maintenance DB!</h3>
      </div>

      <button type="button" id="shareBtn" onclick="handleWhatsAppShare()" class="w-full py-3 bg-emerald-600 active:bg-emerald-800 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 shadow">
        <span>📲</span> Share Maintenance Record on WhatsApp
      </button>

      <button type="button" onclick="resetForm()" class="w-full py-2.5 bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold text-xs rounded-xl transition">
        ➕ New Entry
      </button>
    </div>

    <div id="statusToast" class="hidden mt-3 text-center text-xs font-bold p-2.5 rounded-xl"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4ENNlf6vYrUe-8d4beOLit-YX7U2Dna0fH5ZCSuUKQLmlACrlryHB8scjvird7otI/exec";

    let lastSavedData = null;

    let masterData = {
      staff: ["Sumit", "Ganesh", "Atul", "Ganesh HO"],
      trucks: ["MH40CM8975","MH40BL4725","MH18BZ0274","MH40CM1550","MH18BZ0106","MH18BZ0107","MH14KA9717","MH40CM2748","MH40DC1236","MH18BZ0112","MH40CM1569","OD01AB2773","UP95T9393","MH40CM1570","CG07CG1594","MH18BZ0105","MH18BZ0109","OD01AB2873","AP04UB2935","CG07CG1595","CG07CG1596","MH21BH4147","MH18BZ0268","MH18BZ0269","MH18BZ0271","MH18BZ0272","MH18BG8250","MH18BG8251","MH18BG8252","MH18BZ0110","MH18BZ0113","MH18BZ0267","CG07CG2120","MH18BG8256","MH18BG8257","MH18BZ0108","MH18BZ0270","MH18BZ0275","MH18BG8253","MH40CM2747","MH40CM2746","MH40CD4841","MH40CM7805","OD04M6659","CG07CG1597","MH40CM0731","MH18BZ0273","MH18BZ0276"],
      drivers: ["AKIL KHAN","SHAKIL KHAN","FEROZ KHAN","SANJAY KHABRE","DEVIDAS PATIL","PRAMOD SONWANE","MD IBARAR","RAHUL PAL","RAJESH SHARMA","KRISHNAKUMAR SAHU","RANJIT SONI","BHATU MAHALE","ABDULLAH","MAHENDRA VISHWAKARMA","PRAVIN BHOIR","SINTU YADAV","SUNIL SAHU","OMPRAKASH SAHU","ASHOK SAHU","MD SAGEER","TINKU YADAV","MD MIRAJ","SHOEB PATHAN","KAILASH PATIL"],
      vendors: ["SHREE GANESH TYRES", "NEW BOMBAY GARAGE", "MAHALAXMI AUTO", "OM MOTORS"],
      approvers: ["Ganesh Shewatkar", "Atul", "Sumit", "Branch Manager"],
      checklist: ["Engine Oil Change", "Brake Shoe Work", "Greasing Work", "Clutch Overhaul", "Air Filter Cleaning", "Leaf Spring Repair", "Electrical / Wiring", "Coolant Top-up", "Tyre Puncture / Alignment"]
    };

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('openDate').value = today;
      document.getElementById('closeDate').value = today;

      populateStaff(masterData.staff);
      renderChecklist(masterData.checklist);
      toggleOutsideVendor();
      fetchMasters();
    });

    async function fetchMasters() {
      try {
        const res = await fetch(SCRIPT_URL, { method: "GET" });
        if (res.ok) {
          const liveData = await res.json();
          if (liveData && liveData.status === "success") {
            if (liveData.staff?.length) { masterData.staff = liveData.staff; populateStaff(masterData.staff); }
            if (liveData.trucks?.length) masterData.trucks = liveData.trucks;
            if (liveData.drivers?.length) masterData.drivers = liveData.drivers;
            if (liveData.vendors?.length) masterData.vendors = liveData.vendors;
            if (liveData.approvers?.length) masterData.approvers = liveData.approvers;
            if (liveData.checklist?.length) { masterData.checklist = liveData.checklist; renderChecklist(masterData.checklist); }
            showToast("Synced with Google Sheet Masters!", "emerald");
            setTimeout(hideToast, 2000);
          }
        }
      } catch (e) {
        console.warn("Using offline master cache", e);
      }
    }

    function populateStaff(staffList) {
      const select = document.getElementById('staffSelect');
      const cur = select.value;
      select.innerHTML = '<option value="">Select Staff...</option>';
      (staffList || []).forEach(s => select.innerHTML += `<option value="${s}">${s}</option>`);
      select.innerHTML += '<option value="__OTHER__">➕ Other / Enter Name</option>';
      if (cur) select.value = cur;
    }

    function toggleCustomStaff() {
      const sel = document.getElementById('staffSelect');
      const inp = document.getElementById('staffCustom');
      if (sel.value === "__OTHER__") {
        inp.classList.remove('hidden'); inp.required = true; inp.focus();
      } else {
        inp.classList.add('hidden'); inp.required = false; inp.value = '';
      }
    }

    function toggleOutsideVendor() {
      const amcServ = document.getElementById('amcService').value;
      const vendorBlock = document.getElementById('vendorBlock');
      const vendorInput = document.getElementById('vendorInput');
      if (amcServ === "Yes") {
        vendorBlock.classList.add('hidden');
        vendorInput.required = false;
        vendorInput.value = '';
      } else {
        vendorBlock.classList.remove('hidden');
        vendorInput.required = true;
      }
    }

    function renderChecklist(items) {
      const cont = document.getElementById('checklistContainer');
      cont.innerHTML = '';
      items.forEach((item, idx) => {
        cont.innerHTML += `
          <label class="flex items-center gap-2.5 text-xs text-slate-700 font-medium cursor-pointer">
            <input type="checkbox" name="serviceTask" value="${item}" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4" />
            <span>${item}</span>
          </label>
        `;
      });
    }

    function addCustomTask() {
      const inp = document.getElementById('customTaskInput');
      const val = inp.value.trim();
      if (!val) return;
      if (!masterData.checklist.includes(val)) {
        masterData.checklist.push(val);
        renderChecklist(masterData.checklist);
        const boxes = document.querySelectorAll('input[name="serviceTask"]');
        boxes[boxes.length - 1].checked = true;
      }
      inp.value = '';
    }

    function filterOptions(type, query) {
      closeAllDropdowns();
      const dropdownEl = document.getElementById(type + 'Dropdown');
      
      let items = [];
      if (type === 'truck') items = masterData.trucks;
      else if (type === 'driver') items = masterData.drivers;
      else if (type === 'vendor') items = masterData.vendors;
      else if (type === 'approver') items = masterData.approvers;

      const q = query.replace(/\s+/g, '').toUpperCase();
      const matched = q ? items.filter(i => i.toUpperCase().includes(q)) : items;

      let html = '';
      if (matched.length > 0) {
        matched.forEach(item => {
          html += `
            <div class="px-3 py-2.5 text-xs font-semibold hover:bg-indigo-50 cursor-pointer border-b border-slate-100 flex justify-between items-center"
                 onclick="selectOption('${type}', '${item.replace(/'/g, "\\'")}')">
              <span>${item}</span>
              <span class="text-[10px] text-slate-400">Master</span>
            </div>`;
        });
      }

      const exactExists = items.some(i => i.toUpperCase() === q);
      if (q && !exactExists) {
        html += `
          <div class="px-3 py-2.5 text-xs font-bold text-indigo-800 bg-indigo-50 hover:bg-indigo-100 cursor-pointer flex justify-between items-center"
               onclick="selectOption('${type}', '${q.replace(/'/g, "\\'")}')">
            <span>➕ Use "${q}"</span>
            <span class="text-[10px] bg-indigo-200 text-indigo-900 px-1.5 py-0.5 rounded">New</span>
          </div>`;
      }

      dropdownEl.innerHTML = html;
      dropdownEl.classList.remove('hidden');
    }

    function selectOption(type, value) {
      document.getElementById(type + 'Input').value = value;
      closeAllDropdowns();
    }

    function closeAllDropdowns() {
      ['truckDropdown', 'driverDropdown', 'vendorDropdown', 'approverDropdown'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      closeAllDropdowns();

      const staffSel = document.getElementById('staffSelect');
      const submittedBy = staffSel.value === "__OTHER__" ? document.getElementById('staffCustom').value.trim() : staffSel.value;
      const truckVal = document.getElementById('truckInput').value.replace(/\s+/g, '').toUpperCase();
      const billVal = document.getElementById('billAmount').value.trim();

      const truckRegex = /^[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{4}$/;
      if (!truckRegex.test(truckVal)) {
        alert("Invalid Truck Number! Must follow standard format without space (e.g. MH18BZ0271).");
        return;
      }

      const selectedServices = Array.from(document.querySelectorAll('input[name="serviceTask"]:checked')).map(el => el.value);

      lastSavedData = {
        submittedBy: submittedBy,
        truckNo: truckVal,
        driverName: document.getElementById('driverInput').value.trim(),
        issue: document.getElementById('issueInput').value.trim(),
        amcCover: document.getElementById('amcCover').value,
        amcService: document.getElementById('amcService').value,
        outsideVendor: document.getElementById('vendorInput').value.trim(),
        services: selectedServices,
        openDate: document.getElementById('openDate').value || "",
        openTime: document.getElementById('openTime').value || "",
        closeDate: document.getElementById('closeDate').value || "",
        closeTime: document.getElementById('closeTime').value || "",
        billAmount: billVal,
        approvedBy: document.getElementById('approverInput').value.trim(),
        remark: document.getElementById('remarkInput').value.trim() || "-"
      };

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving to Google Sheet...";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(lastSavedData)
        });

        document.getElementById('maintForm').classList.add('opacity-50', 'pointer-events-none');
        document.getElementById('shareSection').classList.remove('hidden');
        showToast("Saved to Maintenance DB!", "emerald");
      } catch (err) {
        document.getElementById('maintForm').classList.add('opacity-50', 'pointer-events-none');
        document.getElementById('shareSection').classList.remove('hidden');
        showToast("Saved to Sheet! (Check live rows).", "emerald");
      }
    }

    function handleWhatsAppShare() {
      if (!lastSavedData) return;

      const servicesText = lastSavedData.services.length > 0 ? lastSavedData.services.join(", ") : "General Inspection";
      const vendorName = lastSavedData.amcService === "Yes" ? "Authorized AMC Workshop" : lastSavedData.outsideVendor;

      const openStr = lastSavedData.openDate + (lastSavedData.openTime ? " " + lastSavedData.openTime : "");
      const closeStr = lastSavedData.closeDate + (lastSavedData.closeTime ? " " + lastSavedData.closeTime : "");

      const msg = 
`🛠️ *FLEET MAINTENANCE LOG*
━━━━━━━━━━━━━━━━━━
🚚 *Truck No:* ${lastSavedData.truckNo}
👤 *Driver:* ${lastSavedData.driverName}
⚠️ *Complaint:* ${lastSavedData.issue}
🛡️ *AMC Covered:* ${lastSavedData.amcCover}
🏢 *Service:* ${lastSavedData.amcService === 'Yes' ? 'AMC Center' : 'Outside Workshop'}
🏪 *Workshop:* ${vendorName}
✅ *Checklist Done:* ${servicesText}
📅 *Opened:* ${openStr}
📅 *Closed:* ${closeStr}
💰 *Bill Amount:* ₹${lastSavedData.billAmount}
✍️ *Approved By:* ${lastSavedData.approvedBy}
📝 *Remark:* ${lastSavedData.remark}
━━━━━━━━━━━━━━━━━━
👷 *Logged By:* ${lastSavedData.submittedBy}`;

      window.location.href = "whatsapp://send?text=" + encodeURIComponent(msg);
      document.getElementById('shareBtn').innerText = "✓ Sent to WhatsApp (Tap to re-send)";
    }

    function resetForm() {
      document.getElementById('maintForm').reset();
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('openDate').value = today;
      document.getElementById('closeDate').value = today;

      document.getElementById('maintForm').classList.remove('opacity-50', 'pointer-events-none');
      document.getElementById('shareSection').classList.add('hidden');
      document.getElementById('staffCustom').classList.add('hidden');
      document.getElementById('staffCustom').required = false;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = false;
      saveBtn.innerText = "Record Maintenance & Send WhatsApp";
      hideToast();
      toggleOutsideVendor();
      fetchMasters();
    }

    function showToast(text, color) {
      const toast = document.getElementById('statusToast');
      toast.className = `mt-3 text-center text-xs font-bold p-2.5 rounded-xl bg-${color}-100 text-${color}-800`;
      toast.innerText = text;
      toast.classList.remove('hidden');
    }

    function hideToast() {
      document.getElementById('statusToast').classList.add('hidden');
    }
  </script>
</body>
</html>
